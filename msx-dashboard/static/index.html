<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSX Account Dashboard — Alberta Health Services</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 id="account-name">Loading…</h1>
    <span id="mode-badge" class="badge">…</span>
  </header>

  <main>
    <section class="card" id="account-card">
      <h2>Account</h2>
      <dl id="account-details"></dl>
    </section>

    <section class="card" id="rob-card">
      <h2>Run of Business (ROB) Summary</h2>
      <div class="stat-grid" id="rob-stats"></div>
    </section>

    <section class="card" id="revenue-card">
      <h2>Revenue by Fiscal Year</h2>
      <table id="revenue-table">
        <thead><tr><th>Fiscal Year</th><th>Actual ($M)</th><th>Target ($M)</th><th>Attainment</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card" id="opportunities-card">
      <h2>Open Opportunities</h2>
      <table id="opportunities-table">
        <thead><tr><th>Name</th><th>Stage</th><th>Est. Value</th><th>Close Date</th><th>Probability</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
